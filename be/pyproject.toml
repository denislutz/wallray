[project]
name = "wallray-api"
version = "0.1.3"
description = "WallRay AI defect assessment API"
authors = [{ name = "Denis Lutz", email = "contact@example.com" }]
requires-python = ">=3.13"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7",
    "email-validator>=2.0",
    # LangGraph + LangChain
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    # LLM providers
    "anthropic>=0.40",
    # Storage / DB
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "boto3>=1.36",
    # Image processing
    "pillow>=11",
    # Templates
    "jinja2>=3.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    # PDF
    "weasyprint>=62",
    # Email
    "resend>=2.0",
    # Payments
    "stripe>=11",
    "bcrypt>=5.0.0",
    "cocoindex>=1.0.13",
    "xhtml2pdf>=0.2.17",
    "sentry-sdk[fastapi]>=2.63.0",
    "markdown>=3.10.2",
    "slowapi>=0.1.10",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real-AI end-to-end tests (requires ANTHROPIC_API_KEY; excluded from qa:be)",
]
